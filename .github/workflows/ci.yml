name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-node-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:room:node
      - run: npm run test:room:bundled

  rust-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - run: npm ci
      - run: cargo fmt --manifest-path rust-server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path rust-server/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:room
      # test:room builds the room UI, so the binary below embeds it. Checking here
      # keeps main releasable: a change that breaks the single-file executable
      # fails on the PR instead of at tag time.
      - run: cargo build --locked --manifest-path rust-server/Cargo.toml
      - run: bash scripts/verify-standalone.sh rust-server/target/debug/cinder-room-relay
