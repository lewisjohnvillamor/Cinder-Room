[package]
name = "cinder-room-relay"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Lewis John Villamor <lewisvillamor26@gmail.com>"]
description = "Ephemeral encrypted relay for Cinder Room"

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
hmac = "0.12.1"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
socketioxide = "0.18.7"
subtle = "2.6.1"
tempfile = "3.20.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
